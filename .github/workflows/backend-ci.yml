name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      IntegrationTests__ConnectionString: "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=CiOnly-SqlPassword123!;TrustServerCertificate=true"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiOnly-SqlPassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiOnly-SqlPassword123!' -C -b -Q 'SELECT 1' -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.4xx

      - name: Restore
        run: dotnet restore ServiceOrders.sln --configfile NuGet.Config

      - name: Check formatting
        run: dotnet format ServiceOrders.sln --no-restore --verify-no-changes

      - name: Build
        run: dotnet build ServiceOrders.sln --configuration Release --no-restore

      - name: Test API, logout, monitoring and SQL Server backup restoration
        run: dotnet test ServiceOrders.sln --configuration Release --no-build --no-restore --logger trx --results-directory TestResults

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
